name: Android nativo
on:
  push:
    branches: [android-nativo-kotlin]
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar ferramentas verificadas
        run: python3 tools/bootstrap-tools.py
      - name: Executar testes
        run: bash tools/test.sh
      - name: Compilar APK nativo
        run: bash tools/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LivroDePrevisoes-Android-teste
          path: android-native/build/livro-de-previsoes-local-test.apk
          if-no-files-found: error
          retention-days: 30
